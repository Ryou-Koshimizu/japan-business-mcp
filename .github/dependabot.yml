version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      e2e:
        patterns: ['*']
