name: 実機試験（公的データとの突き合わせ）
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 1' # 毎週月曜 10:23（日本時間）
permissions: {}
jobs:
  realworld:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: go run ./scripts/realworld -bin bin/japan-business-mcp -stats ""
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realworld-report
          path: docs/realworld/latest.json
          retention-days: 30
